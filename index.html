
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão Suína V3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#101820;--panel:#192630;--panel2:#21323e;--line:#30434f;--text:#edf3f5;--muted:#9aabb5;--orange:#f59e0b;--green:#22c55e;--red:#ef4444;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#344b58,#101820 60%)}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:32px;border-radius:20px;box-shadow:0 20px 60px #0006}
.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}
.brand i{color:var(--orange);font-size:27px}
.login-card h1{font-size:25px;margin:28px 0 8px}.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;background:#111d25;border:1px solid var(--line);border-radius:9px;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{min-height:75px;resize:vertical}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;background:var(--orange);color:#241600}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#7f1d1d;color:white}.btn.small{padding:7px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.wide{width:100%}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:#131f28;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{background:transparent;border:0;color:var(--muted);padding:12px;border-radius:9px;text-align:left;display:flex;gap:12px;align-items:center}
.nav button.active,.nav button:hover{background:var(--panel2);color:white}
.nav button.active i{color:var(--orange)}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}
.main{min-width:0}
.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}
.topbar strong{font-size:16px}.userline{display:flex;align-items:center;gap:12px;color:var(--muted)}
.content{padding:26px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}
.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:24px;font-weight:800;margin-top:9px}
.stat i{color:var(--orange);float:right;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
td{font-size:13px}
.actions{display:flex;gap:6px}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:7px}
.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#334653;font-size:11px}
.pill.good{background:#14532d;color:#bbf7d0}.pill.warn{background:#713f12;color:#fde68a}.pill.bad{background:#7f1d1d;color:#fecaca}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input,.toolbar select{max-width:240px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:15px;z-index:20}
.modal-card{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;padding:13px 18px;background:#14532d;color:white;border-radius:10px;z-index:50;box-shadow:0 8px 30px #0006}
.toast.error{background:#7f1d1d}
.empty{text-align:center;padding:30px;color:var(--muted)}
.statusline{font-size:11px;color:var(--muted)}
.positive{color:var(--green)}.negative{color:#f87171}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.sidebar .brand{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.side-bottom{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.content{padding:15px}.topbar{padding:0 15px}.grid2{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:19px}.form-grid{grid-template-columns:1fr}.userline span{display:none}}
</style>
</head>
<body>

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand"><i class="fa-solid fa-piggy-bank"></i> GESTÃO SUÍNA <span class="pill">V3.0</span></div>
    <h1>Acessar sistema</h1>
    <p class="muted">Entre com sua conta para acessar sua propriedade.</p>
    <form id="loginForm">
      <div class="field"><label>E-MAIL</label><input id="loginEmail" type="email" required autocomplete="username"></div>
      <div class="field"><label>SENHA</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <button class="btn wide" id="loginButton">Entrar <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <p id="loginError" class="muted"></p>
    <p class="statusline">Conexão segura com Supabase.</p>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><i class="fa-solid fa-piggy-bank"></i> GESTÃO SUÍNA</div>
    <div class="nav">
      <button class="active" data-page="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
      <button data-page="lots"><i class="fa-solid fa-layer-group"></i> Lotes</button>
      <button data-page="expenses"><i class="fa-solid fa-wallet"></i> Despesas</button>
      <button data-page="movements"><i class="fa-solid fa-arrows-rotate"></i> Manejo</button>
      <button data-page="sales"><i class="fa-solid fa-hand-holding-dollar"></i> Vendas</button>
      <button data-page="reports"><i class="fa-solid fa-chart-column"></i> Relatórios</button>
      <button data-page="backup"><i class="fa-solid fa-database"></i> Backup e dados</button>
    </div>
    <div class="side-bottom">
      <div class="statusline" id="syncStatus">Aguardando conexão</div>
      <button class="btn secondary wide" style="margin-top:12px" onclick="logout()"> <i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <strong id="pageTitle">Dashboard</strong>
      <div class="userline"><i class="fa-solid fa-cloud"></i><span id="propertyName">Granja Suína</span><span id="userEmail"></span></div>
    </header>
    <section class="content" id="pageContent"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">Cadastro</h2><button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
/* ==========================================================
   GESTÃO SUÍNA V3.0 — SUPABASE
========================================================== */

const SUPABASE_URL = 'https://zkptgqdbfrwaufembroz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_G7ozNHUHH0ggYIrfL8ySvQ_MdbyqEQT';
const PROPERTY_ID = '8a60593a-5b2b-48a4-834e-6364437b3915';
const DB_KEY = 'gestaoSuinaDatabaseV2';
const OLD_KEY = 'gestaoSuinaLots';

const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null, property=null, db={version:3,lots:[],expenses:[],movements:[],sales:[]};
let currentPage='dashboard';
let busy=false;

const $=id=>document.getElementById(id);
const num=v=>Number(v)||0;
const money=v=>num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';

function toast(message,error=false){
  $('toast').textContent=message;
  $('toast').classList.toggle('error',error);
  $('toast').classList.remove('hidden');
  setTimeout(()=>$('toast').classList.add('hidden'),3500);
}
function setSync(message){$('syncStatus').textContent=message;}
function persistLocal(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}
  catch(e){toast('Não foi possível salvar no armazenamento local.',true);return false}
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(DB_KEY)||localStorage.getItem(OLD_KEY);
    if(!raw)return;
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed))db.lots=parsed;
    else if(parsed&&typeof parsed==='object'){
      db={version:3,lots:parsed.lots||[],expenses:parsed.expenses||[],movements:parsed.movements||[],sales:parsed.sales||[]};
    }
  }catch(e){console.error('Falha ao ler dados locais',e)}
}
function totalExpenses(){return db.expenses.reduce((s,e)=>s+num(e.value),0)}
function lotName(id){return db.lots.find(l=>l.id===id)?.name||'Lote não encontrado'}
function lotById(id){return db.lots.find(l=>l.id===id)}
function lotCost(l){return num(l.qty)*num(l.buy)+num(l.feedKg)*num(l.feedPrice)+num(l.meds)+num(l.other)+db.expenses.filter(e=>e.lotId===l.id).reduce((s,e)=>s+num(e.value),0)}
function realized(lotId){return db.sales.filter(s=>s.lotId===lotId).reduce((s,x)=>s+num(x.revenue),0)}
function realizedAll(){return db.sales.reduce((s,x)=>s+num(x.revenue),0)}
function predicted(l){
  const remaining=Math.max(0,num(l.currentQty));
  return remaining*(num(l.saleHead)||num(l.targetWeight)*num(l.saleKg));
}
function projectedProfit(){return db.lots.reduce((s,l)=>s+realized(l.id)+predicted(l)-lotCost(l),0)}
function totalCost(){return db.lots.reduce((s,l)=>s+lotCost(l),0)+db.expenses.filter(e=>!e.lotId).reduce((s,e)=>s+num(e.value),0)}
function age(l){return l.start?Math.max(0,Math.floor((new Date(today())-new Date(l.start+'T12:00:00'))/86400000)):0}
function remainingDays(l){return num(l.days||150)-age(l)}
function categoryMap(c){
  const m={'Alimentação':'feed','Medicamentos':'medication','Vacinas':'medication','Mão de obra':'labor','Transporte':'transport','Energia e água':'structure','Instalações':'structure','Outros':'other'};
  return m[c]||(['feed','medication','labor','transport','structure','other'].includes(c)?c:'other');
}
function categoryLabel(c){
  const m={feed:'Alimentação',medication:'Medicamentos',labor:'Mão de obra',transport:'Transporte',structure:'Estrutura',other:'Outros'};
  return m[c]||c||'Outros';
}
function movementMap(t){return ({entrada:'entry',perda:'mortality',ajuste:'adjustment',entry:'entry',mortality:'mortality',adjustment:'adjustment'})[t]||'adjustment'}
function movementLocal(t){return ({entry:'entrada',mortality:'perda',adjustment:'ajuste',transfer_in:'entrada',transfer_out:'perda'})[t]||'ajuste'}

function showLogin(){
  $('loginScreen').classList.remove('hidden');$('app').classList.add('hidden');
}
function showApp(){
  $('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');
  $('userEmail').textContent=user.email||'';
  $('propertyName').textContent=property?.name||'Granja Suína';
}
async function login(event){
  event.preventDefault();
  $('loginError').textContent='';
  $('loginButton').disabled=true;
  try{
    const {data,error}=await supabase.auth.signInWithPassword({
      email:$('loginEmail').value.trim(),
      password:$('loginPassword').value
    });
    if(error)throw error;
    user=data.user;
    await initializeSession();
  }catch(e){
    $('loginError').textContent=e.message||'Não foi possível entrar.';
    await supabase.auth.signOut();
  }finally{$('loginButton').disabled=false}
}
async function logout(){
  await supabase.auth.signOut();
  user=null;property=null;showLogin();
}
async function initializeSession(){
  setSync('Validando usuário...');
  const {data:profile,error:profileError}=await supabase.from('profiles')
    .select('id,email,full_name,role,active').eq('id',user.id).single();
  if(profileError)throw profileError;
  if(!profile.active)throw new Error('Usuário inativo. Contate o administrador.');
  const {data:prop,error:propError}=await supabase.from('properties')
    .select('*').eq('id',PROPERTY_ID).eq('active',true).single();
  if(propError)throw propError;
  property=prop;
  showApp();
  loadLocal();
  await syncInitial();
  render();
}
async function syncInitial(){
  setSync('Carregando dados da nuvem...');
  try{
    const [lots,expenses,movements,sales]=await Promise.all([
      supabase.from('lots').select('*').eq('property_id',PROPERTY_ID),
      supabase.from('expenses').select('*').eq('property_id',PROPERTY_ID),
      supabase.from('movements').select('*').eq('property_id',PROPERTY_ID),
      supabase.from('sales').select('*').eq('property_id',PROPERTY_ID)
    ]);
    for(const r of [lots,expenses,movements,sales])if(r.error)throw r.error;
    const remote={
      lots:lots.data.map(mapLotFromRemote),
      expenses:expenses.data.map(mapExpenseFromRemote),
      movements:movements.data.map(mapMovementFromRemote),
      sales:sales.data.map(mapSaleFromRemote)
    };
    const hasRemote=Object.values(remote).some(a=>a.length);
    const hasLocal=Object.values(db).some(a=>Array.isArray(a)&&a.length);
    if(hasRemote){
      db={version:3,...remote};
      persistLocal();
      setSync('Sincronizado com a nuvem');
    }else if(hasLocal){
      setSync('Migrando dados locais...');
      await migrateLocal();
    }else{
      db={version:3,...remote};
      persistLocal();
      setSync('Banco conectado — sem registros');
    }
  }catch(e){
    console.error(e);
    setSync('Falha na sincronização');
    toast('Erro ao carregar nuvem: '+e.message,true);
    throw e;
  }
}
function mapLotFromRemote(r){
  return {id:r.legacy_id||r.id,name:r.name,start:r.entry_date||r.purchase_date||today(),
    qty:num(r.initial_quantity),currentQty:num(r.current_quantity),buy:num(r.purchase_value)/(num(r.initial_quantity)||1),
    feedKg:num(r.feed_kg),feedPrice:num(r.feed_price),meds:num(r.meds),other:num(r.other_costs),
    days:num(r.planned_days)||150,targetWeight:num(r.target_weight),saleKg:num(r.sale_price_kg),
    saleHead:num(r.sale_price_head),status:r.status==='completed'?'vendido':r.status==='cancelled'?'cancelado':'ativo',
    notes:r.notes||'',createdAt:r.created_at};
}
function mapExpenseFromRemote(r){
  return {id:r.legacy_id||r.id,date:r.expense_date,category:r.category_label||categoryLabel(r.category),
    description:r.description,value:num(r.amount),lotId:'',notes:r.notes||'',remoteLotId:r.lot_id};
}
function mapMovementFromRemote(r){
  return {id:r.legacy_id||r.id,date:r.movement_date,lotId:r.legacy_lot_id||'',
    type:r.legacy_type?movementLocal(r.legacy_type):movementLocal(r.movement_type),
    qty:num(r.quantity),previousQty:num(r.previous_quantity),newQty:num(r.new_quantity),notes:r.notes||''};
}
function mapSaleFromRemote(r){
  return {id:r.legacy_id||r.id,date:r.sale_date,lotId:r.legacy_lot_id||'',
    buyer:r.buyer||r.customer_name||'',qty:num(r.quantity),weight:num(r.weight),
    price:num(r.price||r.unit_price),revenue:num(r.total_amount),notes:r.notes||'',
    previousStatus:r.previous_status||'ativo'};
}
async function findRemoteId(table,legacyId){
  const {data,error}=await supabase.from(table).select('id').eq('property_id',PROPERTY_ID).eq('legacy_id',legacyId).maybeSingle();
  if(error)throw error;
  return data?.id||null;
}
async function saveRemote(table,legacyId,payload){
  const id=await findRemoteId(table,legacyId);
  if(id){
    const {error}=await supabase.from(table).update(payload).eq('id',id);
    if(error)throw error;
  }else{
    const {error}=await supabase.from(table).insert({...payload,property_id:PROPERTY_ID,legacy_id:legacyId,created_by:user.id});
    if(error)throw error;
  }
}
async function remoteLotId(legacyId){
  if(!legacyId)return null;
  const id=await findRemoteId('lots',legacyId);
  return id;
}
async function syncLot(l){
  const payload={name:l.name,animal_type:'suino',initial_quantity:num(l.qty),current_quantity:num(l.currentQty),
    entry_date:l.start||null,purchase_date:l.start||null,purchase_value:num(l.qty)*num(l.buy),
    feed_kg:num(l.feedKg),feed_price:num(l.feedPrice),meds:num(l.meds),other_costs:num(l.other),
    planned_days:num(l.days)||150,target_weight:num(l.targetWeight)||null,
    sale_price_kg:num(l.saleKg)||null,sale_price_head:num(l.saleHead)||null,
    status:l.status==='vendido'?'completed':l.status==='cancelado'?'cancelled':'active',notes:l.notes||''};
  await saveRemote('lots',l.id,payload);
}
async function syncExpense(e){
  await saveRemote('expenses',e.id,{description:e.description,category:categoryMap(e.category),
    category_label:e.category,amount:num(e.value),expense_date:e.date,
    lot_id:await remoteLotId(e.lotId),notes:e.notes||'',payment_status:'paid'});
}
async function syncMovement(m){
  const quantity=Math.abs(num(m.qty));
  if(quantity===0)return;
  await saveRemote('movements',m.id,{lot_id:await remoteLotId(m.lotId),
    movement_type:movementMap(m.type),legacy_type:m.type,quantity,
    movement_date:m.date,previous_quantity:num(m.previousQty),new_quantity:num(m.newQty),
    notes:m.notes||''});
}
async function syncSale(s){
  await saveRemote('sales',s.id,{lot_id:await remoteLotId(s.lotId),customer_name:s.buyer||null,buyer:s.buyer||null,
    sale_date:s.date,quantity:num(s.qty),weight:num(s.weight),price:num(s.price),unit_price:num(s.price),
    total_amount:num(s.revenue),payment_status:'pending',previous_status:s.previousStatus||'ativo',notes:s.notes||''});
}
async function migrateLocal(){
  for(const l of db.lots)await syncLot(l);
  for(const e of db.expenses)await syncExpense(e);
  for(const m of db.movements)await syncMovement(m);
  for(const s of db.sales)await syncSale(s);
  setSync('Migração concluída');
  toast('Dados locais enviados para o Supabase.');
}
async function saveAllRemote(type,items){
  setSync('Sincronizando...');
  try{
    if(type==='lots')for(const x of items)await syncLot(x);
    if(type==='expenses')for(const x of items)await syncExpense(x);
    if(type==='movements')for(const x of items)await syncMovement(x);
    if(type==='sales')for(const x of items)await syncSale(x);
    persistLocal();
    setSync('Sincronizado com a nuvem');
    return true;
  }catch(e){
    console.error(e);
    setSync('Erro na sincronização');
    toast('Erro ao salvar na nuvem: '+e.message,true);
    return false;
  }
}
async function deleteRemote(table,legacyId){
  const id=await findRemoteId(table,legacyId);
  if(!id)return;
  const {error}=await supabase.from(table).delete().eq('id',id);
  if(error)throw error;
}
async function deleteLotRemote(id){
  const lotId=await remoteLotId(id);
  if(!lotId)return;
  for(const table of ['expenses','movements','sales']){
    const {error}=await supabase.from(table).delete().eq('property_id',PROPERTY_ID).eq('lot_id',lotId);
    if(error)throw error;
  }
  const {error}=await supabase.from('lots').delete().eq('id',lotId);
  if(error)throw error;
}

/* ==========================================================
   NAVEGAÇÃO E RENDERIZAÇÃO
========================================================== */
function navigate(page){
  currentPage=page;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  render();
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
function render(){
  const titles={dashboard:'Dashboard',lots:'Lotes',expenses:'Despesas',movements:'Manejo',sales:'Vendas',reports:'Relatórios',backup:'Backup e dados'};
  $('pageTitle').textContent=titles[currentPage]||'Gestão Suína';

async function saveLot(e,id){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const old=id?lotById(id):null;
  const qty=num(f.qty);
  if(!Number.isInteger(qty)||qty<1){toast('Quantidade inicial inválida.',true);return}
  const lot={...(old||{}),id:id||uid(),name:f.name.trim(),start:f.start,qty,
    currentQty:old?num(old.currentQty):qty,buy:num(f.buy),feedKg:num(f.feedKg),feedPrice:num(f.feedPrice),
    meds:num(f.meds),other:num(f.other),days:num(f.days)||150,targetWeight:num(f.targetWeight),
    saleKg:num(f.saleKg),saleHead:num(f.saleHead),status:f.status,notes:f.notes||'',createdAt:old?.createdAt||new Date().toISOString()};
  if(qty<lot.currentQty){toast('Quantidade inicial não pode ser menor que o saldo atual.',true);return}
  if(!lot.name){toast('Informe o nome do lote.',true);return}
  const previous=db.lots;db.lots=id?db.lots.map(x=>x.id===id?lot:x):[...db.lots,lot];
  persistLocal();
  if(!await saveAllRemote('lots',[lot])){db.lots=previous;persistLocal();return}
  closeModal();render();toast('Lote salvo e sincronizado.');
}
async function deleteLot(id){
  const linked=db.expenses.some(x=>x.lotId===id)||db.movements.some(x=>x.lotId===id)||db.sales.some(x=>x.lotId===id);
  if(!confirm(linked?'Excluir lote e todos os registros vinculados?':'Excluir este lote?'))return;
  try{
    await deleteLotRemote(id);
    db.lots=db.lots.filter(x=>x.id!==id);db.expenses=db.expenses.filter(x=>x.lotId!==id);
    db.movements=db.movements.filter(x=>x.lotId!==id);db.sales=db.sales.filter(x=>x.lotId!==id);
    persistLocal();render();toast('Lote excluído.');
  }catch(e){toast('Erro ao excluir lote: '+e.message,true)}
}

async function saveMovement(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const lot=lotById(f.lotId);
  const qty=Number(f.qty);if(!lot||!Number.isInteger(qty)||qty<0||(f.type!=='ajuste'&&qty<1)){toast('Quantidade inválida.',true);return}
  const previous={...lot};let delta=0;
  if(f.type==='perda'){if(qty>lot.currentQty){toast('Perdas maiores que o saldo.',true);return}delta=-qty}
  if(f.type==='entrada')delta=qty;
  if(f.type==='ajuste')delta=qty-lot.currentQty;
  if(delta===0){toast('O ajuste não altera o saldo. Nenhuma movimentação foi criada.',true);return}
  if(f.type==='entrada'){lot.qty+=qty;lot.currentQty+=qty}
  else if(f.type==='perda')lot.currentQty-=qty;
  else{lot.currentQty=qty;if(qty>lot.qty)lot.qty=qty;lot.status=qty===0?'vendido':'ativo'}
  const m={id:uid(),date:f.date,lotId:lot.id,type:f.type,qty:Math.abs(delta),previousQty:previous.currentQty,newQty:lot.currentQty,notes:f.notes||''};
  db.movements.push(m);persistLocal();
  if(!await saveAllRemote('lots',[lot])||!await saveAllRemote('movements',[m])){
    Object.assign(lot,previous);db.movements=db.movements.filter(x=>x.id!==m.id);persistLocal();return
  }
  closeModal();render();toast('Manejo registrado.');
}
async function deleteMovement(id){
  const m=db.movements.find(x=>x.id===id);if(!m)return;
  const lot=lotById(m.lotId);if(!lot)return;
  if(db.movements.some(x=>x.lotId===lot.id&&x.id!==id)||db.sales.some(x=>x.lotId===lot.id)){toast('Exclusão bloqueada: existem outros eventos neste lote.',true);return}
  if(!confirm('Excluir movimentação e reverter saldo?'))return;
  const old={...lot};
  if(m.type==='perda')lot.currentQty+=m.qty;
  else if(m.type==='entrada'){lot.currentQty-=m.qty;lot.qty-=m.qty}
  else lot.currentQty=m.previousQty;
  if(lot.currentQty<0||lot.currentQty>lot.qty){Object.assign(lot,old);toast('Reversão inválida.',true);return}
  try{await deleteRemote('movements',id);await syncLot(lot);db.movements=db.movements.filter(x=>x.id!==id);persistLocal();render();toast('Movimentação removida.')}
  catch(e){Object.assign(lot,old);toast(e.message,true)}
}

async function saveSale(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const lot=lotById(f.lotId);
  const qty=num(f.qty),weight=num(f.weight),price=num(f.price);
  if(!lot||!Number.isInteger(qty)||qty<1||qty>lot.currentQty||weight<=0||price<=0){toast('Confira quantidade, peso e preço.',true);return}
  const previous={...lot};lot.currentQty-=qty;const previousStatus=lot.status;if(lot.currentQty===0)lot.status='vendido';
  const s={id:uid(),date:f.date,lotId:lot.id,buyer:f.buyer,qty,weight,price,revenue:weight*price,notes:f.notes||'',previousStatus};
  db.sales.push(s);persistLocal();
  if(!await saveAllRemote('lots',[lot])||!await saveAllRemote('sales',[s])){
    Object.assign(lot,previous);db.sales=db.sales.filter(x=>x.id!==s.id);persistLocal();return
  }
  closeModal();render();toast('Venda registrada e sincronizada.');
}
async function deleteSale(id){
  const s=db.sales.find(x=>x.id===id);if(!s)return;const lot=lotById(s.lotId);if(!lot)return;
  if(db.sales.some(x=>x.lotId===lot.id&&x.id!==id)||db.movements.some(x=>x.lotId===lot.id)){toast('Exclusão bloqueada: existem outros eventos neste lote.',true);return}
  if(!confirm('Excluir venda e devolver animais ao lote?'))return;
  const old={...lot};lot.currentQty+=s.qty;
  if(lot.currentQty>lot.qty){Object.assign(lot,old);toast('Saldo excederia quantidade inicial.',true);return}
  lot.status=s.previousStatus||'ativo';
  try{await deleteRemote('sales',id);await syncLot(lot);db.sales=db.sales.filter(x=>x.id!==id);persistLocal();render();toast('Venda excluída.')}
  catch(e){Object.assign(lot,old);toast(e.message,true)}
}

/* ==========================================================
   BACKUP E SINCRONIZAÇÃO MANUAL
========================================================== */
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'Gestão Suína',version:3,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-gestao-suina-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importBackup(e){
  const file=e.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const p=JSON.parse(reader.result);const d=p.data||p;
      if(!Array.isArray(d.lots)||!Array.isArray(d.expenses)||!Array.isArray(d.movements)||!Array.isArray(d.sales))throw new Error('Estrutura de backup inválida.');
      if(!confirm('Os dados locais serão substituídos pelos dados do backup. Deseja continuar?'))return;
      db={version:3,lots:d.lots,expenses:d.expenses,movements:d.movements,sales:d.sales};persistLocal();
      await migrateLocal();render();toast('Backup importado e enviado à nuvem.');
    }catch(err){toast(err.message,true)}
    finally{e.target.value=''}
  };reader.readAsText(file);
}
async function refreshCloud(){
  if(!confirm('Atualizar os dados locais com os dados da nuvem?'))return;
  try{await syncInitial();render();toast('Dados atualizados.')}
  catch(e){toast(e.message,true)}
}

========================================================== */
$('loginForm').addEventListener('submit',login);
(async()=>{
  loadLocal();
  const {data}=await supabase.auth.getSession();
  if(data.session){
    user=data.session.user;
    try{await initializeSession()}
    catch(e){console.error(e);toast('Não foi possível iniciar: '+e.message,true);showLogin()}
  }else showLogin();
})();
supabase.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){user=null;showLogin()}
});
</script>
